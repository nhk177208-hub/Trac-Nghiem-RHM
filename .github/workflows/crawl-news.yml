name: Crawl dental news

on:
  schedule:
    # 4 lần/ngày (UTC) = 06:07, 12:07, 18:07, 00:07 giờ Việt Nam (UTC+7)
    # Đặt phút 07 thay vì 00 để tránh giờ cao điểm của GitHub (đỡ bị trễ/bỏ lượt)
    - cron: '7 23,5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl
        run: node scripts/crawl-news.mjs
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # tùy chọn
      - name: Commit news
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A TinTuc
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "chore(news): cập nhật tin nha khoa $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
