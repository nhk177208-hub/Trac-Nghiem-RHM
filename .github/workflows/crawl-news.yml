name: Crawl dental news

on:
  schedule:
    # 4 lần/ngày (UTC) = 07:17, 13:17, 19:17, 01:17 giờ Việt Nam
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl
        run: node scripts/crawl-news.mjs
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # tùy chọn
      - name: Commit news.json
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add TinTuc/news.json
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "chore(news): cập nhật tin nha khoa $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
