           Không thấy thì lấy đầu trang đó. */
        function locate(H, page, needle) {
            const T = H.text() || '', P = H.pages() || [];
            const want = String(needle).normalize('NFKD').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 28);
            for (const pn of [page, page + 1]) {
                const pg = P[pn - 1];
                if (!pg) continue;
                const keys = [], map = [];
                for (let i = pg.gs; i < pg.ge; i++) {
                    for (const ch of T[i].normalize('NFKD').toLowerCase()) {
                        if (/[a-z0-9]/.test(ch)) { keys.push(ch); map.push(i); }
                    }
                }
                const j = keys.join('').indexOf(want);
                if (j >= 0) return map[j];
            }
            const first = P[page - 1];
            return first ? first.gs : -1;
        }

                        manual: false,
