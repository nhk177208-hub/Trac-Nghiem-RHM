<!DOCTYPE html>
<html lang="vi">
<head><meta charset="utf-8"><title>Menu sách — Nhận diện theo List.txt</title></head>
<body>
<script>
// Menu.html tự động lấy danh sách chương & mục lục đã phân tích từ List.txt trong cùng thư mục sách
(function () {
    const listData = TOC.listData || (TOC.listTxt ? TOC.parseListTxt(TOC.listTxt) : null);
    const chapters = {};

    if (listData && Array.isArray(listData.chapters)) {
        listData.chapters.forEach(ch => {
            const entry = {
                num: ch.num,
                title: ch.title,
                en: ch.en || ch.title,
                sections: ch.sections
            };
            chapters['Chương ' + ch.num] = entry;
            chapters[String(ch.num)] = entry;
            if (ch.title) chapters[ch.title] = entry;
            if (ch.en) chapters[ch.en] = entry;
        });
    }

    TOC.menu({
        book: 'Advanced Operative Dentistry: A Practical Approach',
        // Quy tắc đọc PDF 2 cột chuẩn cho sách giáo khoa RHM
        reader_rules: {
            reading_order: 'col1_top_down_then_col2',
            auto_two_column: true,
            header_top_ratio: 0.92,
            footer_bottom_ratio: 0.08,
            skip_graphics_boxes: true,
            skip_captions: true,
            skip_footnotes: true,
            skip_figure_labels: true
        },
        chapters: chapters
    });
})();
</script>
</body>
</html>
