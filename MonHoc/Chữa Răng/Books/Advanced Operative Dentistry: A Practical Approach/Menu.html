        if (pg.num === 1) {
            body0.forEach(it => {
                if (it.y > H * 0.76) excl.add(it);
            });
        }
    }

    // 2.2. Cắt bỏ hoàn toàn khối "CHAPTER CONTENTS" ở Trang 1 và phần "FURTHER READING" ở cuối chương
    function trimOrder(ctx) {
        const { pg, ord } = ctx;
        if (!Array.isArray(ord) || !ord.length) return ord;

        // a) Trang 1: Bỏ toàn bộ khung CHAPTER CONTENTS (cho đến khi gặp tiêu đề IN HOA đầu tiên của bài học)
        if (RR.skip_printed_outline_on_page1 && pg.num === 1) {
            page1PrintedOutlineHints = [];
            let inOutline = false;
            const out = [];
            for (let i = 0; i < ord.length; i++) {
                const it = ord[i];
                const t = cleanStr(it.str);
                if (!inOutline && /^CHAPTER\s+CONTENTS$/i.test(t)) {
                    inOutline = true;
                    continue;
                }
                if (inOutline) {
                    // Khi gặp tiêu đề cấp 1 đầu tiên của bài (IN HOA ĐẬM, không phải CHAPTER CONTENTS) -> kết thúc vùng mục lục in sẵn
                    if (isAllCaps(t) && t.length >= 6 && !/^CHAPTER\s+CONTENTS$/i.test(t)) {
                        inOutline = false;
                        out.push(it);
                    } else if (!/^\d{1,3}$/.test(t) && t.length >= 3) {
                        page1PrintedOutlineHints.push(t.replace(/\s+\d{1,3}$/, '').trim());
                    }
                    continue;
                }
                out.push(it);
            }
            return out;
        }

        // b) Trang cuối: Cắt bỏ phần danh mục tài liệu tham khảo (FURTHER READING) để không làm bẩn nội dung mục SUMMARY
        if (HR.stop_at_further_reading) {
            const out = [];
            for (let i = 0; i < ord.length; i++) {
                const it = ord[i];
                const t = cleanStr(it.str);
                if (/^FURTHER\s+READING$/i.test(t) && isAllCaps(t)) {
                    break;
                }
                out.push(it);
            }
            return out;
        }

        return ord;
    }

    // 2.3. Dò ứng viên tiêu đề trên từng trang (Nhận diện Mềm theo thiết kế của sách Advanced Operative Dentistry)
    function detectCandidates(ctx) {
        const { pg, ord, cid, rg, bodyFh } = ctx;
        if (!Array.isArray(ord) || !ord.length) return [];

        const lines = [];
        ord.forEach(it => {
            const r = rg[it.idx];
            if (!r) return;
            const prev = lines[lines.length - 1];
            if (prev && prev.col === cid(it) && Math.abs(it.y - prev.y) <= 0.45 * Math.max(it.fh, prev.fh)) {
                prev.text += (it.x - prev.x1 > 0.12 * prev.fh ? ' ' : '') + it.str;
                prev.x1 = Math.max(prev.x1, it.x + (it.w || 0));
                prev.fh = Math.max(prev.fh, it.fh);
                prev.bd = prev.bd || !!it.bd;
                prev.e = r.e;
            } else {
                lines.push({
                    col: cid(it),
                    x0: it.x,
                    x1: it.x + (it.w || 0),
                    y: it.y,
                    fh: it.fh,
                    bd: !!it.bd,
                    text: it.str,
                    s: r.s,
                    e: r.e
                });
            }
        });

        // Gộp các dòng tiêu đề dài bị xuống dòng (đặc biệt tiêu đề ALL CAPS 2-3 dòng hoặc tiêu đề in đậm 2 dòng)
        const merged = [];
        for (let i = 0; i < lines.length; i++) {
            const cur = Object.assign({}, lines[i]);
            cur.text = cleanStr(cur.text);
            while (i + 1 < lines.length) {
                const nxt = lines[i + 1];
                const nxtTxt = cleanStr(nxt.text);
                const sameStyle = nxt.col === cur.col && Math.abs(nxt.fh - cur.fh) <= 0.55 && (cur.y - nxt.y) > 0 && (cur.y - nxt.y) <= 1.85 * cur.fh;
                const bothCaps = isAllCaps(cur.text) && isAllCaps(nxtTxt);
                const bothBoldHeading = cur.bd && nxt.bd && cur.fh >= (HR.level3_font_ratio || 1.02) * bodyFh && !/[.!?;:]$/.test(cur.text) && nxtTxt.split(/\s+/).length <= 8;
                if (sameStyle && (bothCaps || bothBoldHeading)) {
                    cur.text = cleanStr(cur.text + ' ' + nxtTxt);
                    cur.e = nxt.e;
                    i++;
                } else {
                    break;
                }
            }
            merged.push(cur);
        }

        const forbidRe = new RegExp(HR.forbidden_heading_regex || '^(?:table|fig\\.?|figure|box|further\\s+reading)\\b', 'i');
        const cands = [];

        merged.forEach((ln, idx) => {
            const t = ln.text;
            if (!t || t.length < (HR.min_chars || 3) || t.length > (HR.max_chars || 140)) return;
            const words = t.split(/\s+/).filter(Boolean);
            if (words.length > (HR.max_words || 20)) return;
            if (forbidRe.test(t)) return;
            if (HR.forbid_trailing_period && /\.\s*$/.test(t) && !/\b(?:Dr|Mr|Mrs|vs|etc|al|Fig|St)\.$/.test(t)) return;
            if (/^[\d\s.,%+-]+$/.test(t)) return;

            const ratio = ln.fh / (bodyFh || 10);
            const caps = isAllCaps(t);

            const prevLn = idx > 0 && merged[idx - 1].col === ln.col ? merged[idx - 1] : null;
            const nextLn = idx + 1 < merged.length && merged[idx + 1].col === ln.col ? merged[idx + 1] : null;
            const gapAbove = prevLn ? (prevLn.y - ln.y) / ln.fh : 3;
            const isolated = gapAbove >= 1.12 || !prevLn;

            // Kiểm tra xem dòng này có khớp với danh sách CHAPTER CONTENTS ở trang 1 không
            const inPage1Outline = page1PrintedOutlineHints.some(h => {
                const a = h.toLowerCase().replace(/[^a-z0-9]+/g, '');
                const b = t.toLowerCase().replace(/[^a-z0-9]+/g, '');
                return a.length >= 4 && (a === b || a.includes(b) || b.includes(a));
            });

            let lvl = 0;
            if (caps && (ln.bd || ratio >= 1.08 || isolated)) {
                lvl = 1; // Tiêu đề IN HOA trong sách này luôn là mục lớn cấp 1
            } else if (/^Phase\s+\d+\b/i.test(t) && (ln.bd || isolated)) {
                lvl = 3; // Các giai đoạn điều trị (Phase 1..5)
            } else if (ratio >= (HR.level1_font_ratio || 1.22) && (ln.bd || isolated)) {
                lvl = 2;
            } else if (ratio >= (HR.level2_font_ratio || 1.12) && (ln.bd || inPage1Outline)) {
                lvl = 2;
            } else if ((ln.bd || inPage1Outline) && ratio >= (HR.level3_font_ratio || 1.02) && words.length <= 12 && isolated) {
                lvl = 3;
            } else if (ln.bd && words.length <= 8 && isolated && nextLn && !nextLn.bd) {
                lvl = 4;
            }

            if (lvl > 0) {
                cands.push({
                    page: pg.num,
                    s: ln.s,
                    e: ln.e,
                    fh: Math.round(ln.fh * 10) / 10,
                    ratio: Math.round(ratio * 100) / 100,
                    bd: ln.bd,
                    caps: caps,
                    num: '',
                    lvl: lvl,
                    en: t,
                    title: t
                });
            }
        });

        return cands;
    }

    // 2.4. Định vị chính xác vị trí ký tự `s` của một tiêu đề trong văn bản chương `T`
    function locateHeadingOffset(H, T, item, minPos) {
        if (!T) return -1;
        if (typeof item.s === 'number' && item.s >= 0 && item.s < T.length) return item.s;

        let searchFrom = Math.max(0, minPos || 0);
        const targets = [item.match, item.en, item.title].map(cleanStr).filter(Boolean);

        for (const rawTarget of targets) {
            // Cho phép dấu gạch ngang (-), dấu cách hoặc xuống dòng linh hoạt (ví dụ "dentine-pulp" vs "dentine pulp", "Phase 3 - Re-examination" vs "Phase 3 Re-examination")
            const words = rawTarget.replace(/[-–—]+/g, ' ').split(/\s+/).filter(Boolean);
            if (!words.length) continue;
            const pat = words.slice(0, 10).map(escRe).join('[\\s\\n\\-–—]+');
            const re = new RegExp(pat, 'ig');
            re.lastIndex = searchFrom;
            let m;
            while ((m = re.exec(T))) {
                if (!H || typeof H.lineStart !== 'function' || H.lineStart(T, m.index)) {
                    return m.index;
                }
            }
            // Dự phòng tìm từ đầu chương
            re.lastIndex = 0;
            while ((m = re.exec(T))) {
                if (!H || typeof H.lineStart !== 'function' || H.lineStart(T, m.index)) {
                    return m.index;
                }
            }
        }
        return -1;
    }

    // 2.5. Nhận diện Cứng: Khớp danh sách mục lục chuẩn đã khai báo cho chương (hỗ trợ khớp cả theo số chương "Chương 1", "Chương 2", "Chương 3")
    function findHardChapterConfig(H) {
        const direct = H && typeof H.chapterMenu === 'function' ? H.chapterMenu() : null;
        if (direct && Array.isArray(direct.sections) && direct.sections.length) return direct;

        const chap = (H && typeof H.chapter === 'function' && H.chapter()) || {};
        const title = String(chap.title || '');
        const mNum = title.match(/(?:chương|chapter| bài)\s*0*(\d+)/i) || title.match(/^\s*0*(\d+)\b/);
        if (mNum) {
            const num = parseInt(mNum[1], 10);
            const aliasKey = 'Chapter ' + num;
            if (BOOK_CONFIG.chapters[aliasKey]) return BOOK_CONFIG.chapters[aliasKey];
        }
        return null;
    }

    function hardSections(H) {
        const T = H && typeof H.text === 'function' ? H.text() : '';
        const ch = findHardChapterConfig(H);
        if (!T || !ch || !Array.isArray(ch.sections) || !ch.sections.length) return [];

        const out = [];
        let lastPos = 0;
        ch.sections.forEach(sec => {
            if (!sec) return;
            const pos = locateHeadingOffset(H, T, sec, lastPos);
            if (pos >= 0) {
                const en = cleanStr(sec.en || sec.title || '');
                const vi = cleanStr(sec.title || sec.vi || en);
                out.push({
                    title: H && typeof H.fixVi === 'function' ? H.fixVi(vi, en) : vi,
                    en: en,
                    num: sec.num || '',
                    lvl: Math.max(1, Math.min(10, parseInt(sec.lvl, 10) || 1)),
                    s: pos,
                    e: 0,
                    text: '',
                    hard: true
                });
                lastPos = pos + 1;
            }
        });
        return out.sort((a, b) => a.s - b.s);
    }

    // 2.6. Nhận diện Mềm: Gom ứng viên từ tất cả các trang
    function buildSoftSections(H) {
        const pages = (H && typeof H.pages === 'function' ? H.pages() : []) || [];
        const all = [];
        pages.forEach(pg => {
            (pg.cands || []).forEach(c => {
                if (!all.length || Math.abs(c.s - all[all.length - 1].s) >= 8) {
                    all.push(Object.assign({}, c));
                }
            });
        });
        return all.sort((a, b) => a.s - b.s);
    }

    // 2.7. GỌI AI HỖ TRỢ PHÂN TÍCH LẬP MỤC LỤC Ở CHỖ KHÓ (Dành cho các chương chưa có mục lục cứng)
    async function analyzeHardPartsWithAI(H, T, softCands, onProg) {
        const glossRule = (H && typeof H.glossRule === 'function' ? H.glossRule() : '') +
                          (H && typeof H.glossary === 'function' ? H.glossary(T.slice(0, 12000)) : '');
        const chunkSize = AC.chunk_size_chars || 28000;
        const chunks = [];
        for (let pos = 0; pos < T.length; pos += chunkSize) {
            chunks.push({ start: pos, text: T.slice(pos, pos + chunkSize + 600) });
        }

        const outlineHintStr = page1PrintedOutlineHints.length
            ? '\nDANH SÁCH MỤC LỤC IN SẴN Ở TRANG 1 (CHAPTER CONTENTS) ĐỂ ĐỐI CHIẾU:\n' + page1PrintedOutlineHints.join(' | ')
            : '';

        const aiFound = [];
        for (let i = 0; i < chunks.length; i++) {
            if (typeof onProg === 'function') onProg(i + 1, chunks.length);
            const ck = chunks[i];
            const localCands = softCands
                .filter(c => c.s >= ck.start && c.s < ck.start + chunkSize)
                .map(c => ({ en: c.en, lvl: c.lvl, ratio: c.ratio, bold: c.bd, caps: c.caps, page: c.page }));

            const sysPrompt =
                'Bạn là giáo sư đầu ngành Răng Hàm Mặt đang phân tích chương sách "Advanced Operative Dentistry: A Practical Approach" để lập mục lục chuẩn xác.\n' +
                'QUY TẮC NHẬN DIỆN CỦA SÁCH NÀY:\n' +
                '1. Tiêu đề cấp 1 (lvl=1) luôn viết IN HOA TOÀN BỘ (ALL CAPS).\n' +
                '2. Tiêu đề cấp 2, 3, 4 (lvl=2, 3, 4) viết chữ thường in đậm, phân cấp theo ý nghĩa học thuật và cỡ chữ.\n' +
                '3. BỎ QUA hoàn toàn chú thích hình ảnh (Figure 1.1...), bảng biểu (Table 1.1...), nhãn sơ đồ và mục FURTHER READING.\n' +
                '4. Trả về "en" (nguyên văn tiêu đề tiếng Anh trong bài) và "vi" (bản dịch tiếng Việt chuẩn thuật ngữ Răng Hàm Mặt miền Nam).\n' +
                glossRule +
                '\nChỉ trả về MỘT đối tượng JSON hợp lệ: {"sections":[{"en":"...","vi":"...","lvl":1}]}';

            const userPrompt =
                outlineHintStr +
                '\n\nỨNG VIÊN DÒ MỀM:\n' + JSON.stringify(localCands.slice(0, 80)) +
                '\n\nVĂN BẢN CHƯƠNG (phần ' + (i + 1) + '/' + chunks.length + '):\n' + ck.text;

            let res = null;
            try { res = await H.ai(sysPrompt, userPrompt, 6000); } catch (e) {}
            const list = (res && Array.isArray(res.sections)) ? res.sections : [];
            let lastPos = ck.start;
            list.forEach(it => {
                if (!it || !it.en) return;
                const pos = locateHeadingOffset(H, T, { en: it.en, match: it.en }, lastPos);
                if (pos >= 0) {
                    const enClean = cleanStr(it.en);
                    const viClean = cleanStr(it.vi || enClean);
                    aiFound.push({
                        en: enClean,
                        title: H && typeof H.fixVi === 'function' ? H.fixVi(viClean, enClean) : viClean,
                        num: '',
                        lvl: Math.max(1, Math.min(6, parseInt(it.lvl, 10) || 1)),
                        s: pos,
                        e: 0,
                        text: ''
                    });
                    lastPos = pos + 1;
                }
            });
        }
        return aiFound;
    }

    // 2.8. BƯỚC AI KIỂM DUYỆT LẦN CUỐI (FINAL AI VERIFICATION PASS)
    async function verifyMenuWithAI(H, T, draftSecs) {
        if (!draftSecs || !draftSecs.length || !H || typeof H.hasAi !== 'function' || !H.hasAi()) {
            return draftSecs;
        }
        const chapInfo = (typeof H.chapter === 'function' && H.chapter()) || {};
        const glossRule = (H && typeof H.glossRule === 'function' ? H.glossRule() : '') +
                          (H && typeof H.glossary === 'function' ? H.glossary(draftSecs.map(s => s.en).join(' ')) : '');

        const payload = draftSecs.slice(0, 140).map((sec, idx) => ({
            idx: idx,
            en: sec.en || sec.title,
            vi: sec.title || sec.en,
            lvl: sec.lvl || 1,
            hard: !!sec.hard,
            preview: cleanStr(T.slice(sec.s, Math.min(T.length, sec.s + 160)))
        }));

        const sysPrompt =
            'Bạn là Giáo sư Tổng biên tập sách giáo khoa Răng Hàm Mặt. Hãy KIỂM DUYỆT LẦN CUỐI (Final Verification) danh sách mục lục của chương "' + (chapInfo.title || '') + '" thuộc sách "Advanced Operative Dentistry: A Practical Approach".\n' +
            '1. LOẠI BỎ (keep: false) bất kỳ dòng nào không phải tiêu đề mục thực sự (ví dụ chú thích Figure/Table, nhãn biểu đồ DEPCAT/Cariogram, câu văn thường, hoặc mục FURTHER READING).\n' +
            '2. GIỮ LẠI (keep: true) tất cả các tiêu đề phân mục thực sự (đặc biệt các mục hard: true).\n' +
            '3. CHUẨN HÓA CẤP BẬC ("lvl"): Mục lớn IN HOA là lvl=1; mục con trực thuộc là lvl=2; mục nhỏ hơn là lvl=3, lvl=4.\n' +
            '4. CHUẨN HÓA TIẾNG VIỆT ("vi"): Dịch chính xác tên tiêu đề sang tiếng Việt chuẩn giảng dạy Răng Hàm Mặt miền Nam (nội nha, sửa soạn ống tủy, trám bít ống tủy, lấy vôi và xử lý mặt chân răng, nướu, viêm nướu, viêm nha chu, răng cối, chóp răng, vùng quanh chóp, mão răng, cầu răng, phức hợp ngà - tủy...).\n' +
            glossRule +
            '\nChỉ trả về MỘT đối tượng JSON hợp lệ: {"verified":[{"idx":0,"keep":true,"lvl":1,"vi":"...","en":"..."}]}';

        let res = null;
        try {
            res = await H.ai(sysPrompt, JSON.stringify(payload), 8000);
        } catch (e) {
            return draftSecs;
        }

        const verifiedList = (res && Array.isArray(res.verified)) ? res.verified : null;
        if (!verifiedList || !verifiedList.length) return draftSecs;

        const byIdx = new Map();
        verifiedList.forEach(v => {
            if (v && Number.isInteger(v.idx)) byIdx.set(v.idx, v);
        });

        const finalSecs = [];
        draftSecs.forEach((sec, idx) => {
            const v = byIdx.get(idx);
            if (!v) {
                finalSecs.push(sec);
                return;
            }
            if (v.keep === false && !sec.hard) return;
            const enClean = cleanStr(v.en || sec.en || sec.title);
            let viClean = cleanStr(v.vi || sec.title || enClean);
            if (H && typeof H.fixVi === 'function') viClean = H.fixVi(viClean, enClean);

            finalSecs.push(Object.assign({}, sec, {
                en: enClean,
                title: viClean,
                lvl: Math.max(1, Math.min(6, parseInt(v.lvl, 10) || sec.lvl || 1))
            }));
        });

        return finalSecs.length ? finalSecs : draftSecs;
    }

    // 2.9. HÀM CHÍNH `detect(H, onProg)`
    async function detect(H, onProg) {
        const T = H && typeof H.text === 'function' ? H.text() : '';
        const pages = (H && typeof H.pages === 'function' ? H.pages() : []) || [];
        if (!T || !T.trim()) {
            return { secs: [], message: 'Chương này chưa có dữ liệu chữ để lập mục lục.' };
        }

        // Bước 1: Kiểm tra mục lục Cứng (Nếu chương nằm trong danh sách đã khai báo đầy đủ như Chương 1, 2, 3)
        const hard = hardSections(H);
        if (hard.length >= 5) {
            // Nếu người dùng bấm cập nhật và có AI, cho AI kiểm duyệt lại bản dịch/cấp bậc lần cuối
            if (AC.always_final_verify_by_ai && H.hasAi()) {
                if (typeof onProg === 'function') onProg(1, 1);
                const checked = await verifyMenuWithAI(H, T, hard);
                return { secs: checked, message: '✅ Đã nạp & AI kiểm duyệt mục lục chuẩn (' + checked.length + ' mục)' };
            }
            return { secs: hard, message: '✅ Đã nạp mục lục chuẩn từ Menu.html (' + hard.length + ' mục)' };
        }

        // Bước 2: Với các chương khác chưa khai báo cứng -> chạy Nhận diện Mềm + gọi AI phân tích
        const soft = buildSoftSections(H);
        let combined = H.mergeSecs ? H.mergeSecs(hard, soft) : hard.concat(soft).sort((a, b) => a.s - b.s);

        if (AC.enable_ai_assist) {
            if (!H.hasAi()) {
                H.showGate();
                return { gate: true, secs: combined };
            }
            const aiSecs = await analyzeHardPartsWithAI(H, T, soft, onProg);
            if (aiSecs && aiSecs.length) {
                combined = H.mergeSecs ? H.mergeSecs(combined, aiSecs) : combined.concat(aiSecs).sort((a, b) => a.s - b.s);
            }
        }

        // Bước 3: Bắt buộc AI kiểm duyệt lần cuối
        if (AC.always_final_verify_by_ai && combined.length && H.hasAi()) {
            if (typeof onProg === 'function') onProg(1, 1);
            combined = await verifyMenuWithAI(H, T, combined);
        }

        return {
            secs: combined,
            message: '✅ Đã lập và AI kiểm duyệt mục lục (' + combined.length + ' mục)'
        };
    }

    // 2.10. Quét lại tiểu mục con trong 1 mục đang chọn (`subSections`)
    async function subSections(H, opts) {
        const { seg, title, lvl, start } = opts || {};
        if (!seg || !H || !H.hasAi()) return [];
        const glossRule = (H && typeof H.glossRule === 'function' ? H.glossRule() : '') +
                          (H && typeof H.glossary === 'function' ? H.glossary(seg.slice(0, 8000)) : '');

        const sysPrompt =
            'Bạn là giáo sư đầu ngành Răng Hàm Mặt. Trong đoạn văn thuộc mục "' + (title || '') + '" (cấp ' + (lvl || 1) + '), hãy tìm tất cả các TIỂU MỤC CON nằm bên trong đoạn này và kiểm duyệt kỹ để không lấy nhầm chú thích hình/bảng.\n' +
            'Trả về "en" (nguyên văn tiêu đề gốc), "vi" (tiếng Việt chuẩn RHM miền Nam), "lvl" (lớn hơn ' + (lvl || 1) + ').\n' +
            glossRule +
            '\nChỉ trả về MỘT đối tượng JSON: {"subs":[{"en":"...","vi":"...","lvl":' + ((lvl || 1) + 1) + '}]}';

        let res = null;
        try { res = await H.ai(sysPrompt, seg, 4000); } catch (e) { return []; }
        const list = (res && Array.isArray(res.subs)) ? res.subs : [];
        const T = H.text();
        const out = [];
        let lastPos = start + 1;

        list.forEach(it => {
            if (!it || !it.en) return;
            const pos = locateHeadingOffset(H, T, { en: it.en, match: it.en }, lastPos);
            if (pos > start) {
                const enClean = cleanStr(it.en);
                let viClean = cleanStr(it.vi || enClean);
                if (H && typeof H.fixVi === 'function') viClean = H.fixVi(viClean, enClean);
                out.push({
                    en: enClean,
                    title: viClean,
                    num: '',
                    lvl: Math.max((lvl || 1) + 1, Math.min(10, parseInt(it.lvl, 10) || ((lvl || 1) + 1))),
                    s: pos,
                    e: 0,
                    text: ''
                });
                lastPos = pos + 1;
            }
        });
        return out;
    }

    const ENGINE = {
        begin: function () { page1PrintedOutlineHints = []; },
        excludeItems: excludeItems,
        trimOrder: trimOrder,
        detectCandidates: detectCandidates,
        hardSections: hardSections,
        detect: detect,
        subSections: subSections
    };

    BOOK_CONFIG.engine = ENGINE;
    if (typeof TOC.menu === 'function') TOC.menu(BOOK_CONFIG);
    if (typeof TOC.override === 'function') TOC.override(ENGINE);
})(typeof TOC !== 'undefined' ? TOC : null);
</script>
